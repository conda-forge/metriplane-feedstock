schema_version: 1

context:
  version: "0.4.0.post2"
  python_min: "3.12"

package:
  name: metriplane
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/metriplane/metriplane-${{ version }}.tar.gz
  sha256: 579d2578126fbf3cad07e20e365549cda2d17f49b4bb7b57695fca778f14c0ba
  patches:
    - use-conda-opencv-metadata.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - metriplane = metriplane.cli:main
      - metriplane-run = metriplane.run:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - numpy >=1.26
    - py-opencv >=4.8
    - pyyaml >=6.0
    - websockets >=12.0
    - pydantic >=2.0

tests:
  - python:
      imports:
        - metriplane
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - metriplane --help
      - metriplane-run --help
      - python -c "import cv2; assert hasattr(cv2, 'aruco')"

about:
  summary: Open-source physical observability for workcell evidence, replay, and regression testing.
  license: MIT
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://www.metriplane.com/
  documentation: https://github.com/Miko997/metriplane/tree/main/docs
  repository: https://github.com/Miko997/metriplane

extra:
  recipe-maintainers:
    - Miko997
